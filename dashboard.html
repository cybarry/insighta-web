<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard | Insighta Labs+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
        }

        nav a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
        }

        nav a:hover {
            color: #e6edf3;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 32px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
        }

        .stat-label {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #58a6ff;
        }

        .btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-top: 32px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div>
            <a href="/profiles.html">Profiles</a>
            <a href="/search.html">Search</a>
            <a href="/account.html">Account</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h1>Dashboard</h1>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Profiles</div>
                <div class="stat-value" id="total">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Male</div>
                <div class="stat-value" id="male">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Female</div>
                <div class="stat-value" id="female">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Countries</div>
                <div class="stat-value" id="countries">—</div>
            </div>
        </div>
        <a href="/profiles.html" class="btn">View All Profiles →</a>
    </div>
    <script type="module">
        import { get } from './js/api.js';
        import { requireAuth } from './js/auth.js';

        await requireAuth();

        const API = 'https://insighta-backend-production-b142.up.railway.app';

        const [all, male, female] = await Promise.all([
            get('/api/profiles', { limit: 1 }),
            get('/api/profiles', { gender: 'male', limit: 1 }),
            get('/api/profiles', { gender: 'female', limit: 1 }),
        ]);

        document.getElementById('total').textContent = all?.total ?? '—';
        document.getElementById('male').textContent = male?.total ?? '—';
        document.getElementById('female').textContent = female?.total ?? '—';

        function logout() {
            fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'include' })
                .finally(() => window.location.href = '/index.html');
        }
        window.logout = logout;
    </script>
</body>

</html>
