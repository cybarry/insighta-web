<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Insighta Labs+</title>
    <meta name="description" content="Insighta Labs+ Dashboard — overview of demographic profile data.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #e6edf3, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        nav a {
            color: #7d8590;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active { color: #58a6ff; background: rgba(88, 166, 255, 0.1); }

        .btn-logout {
            background: transparent;
            border: 1px solid #30363d;
            color: #f85149;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .btn-logout:hover { background: rgba(248, 81, 73, 0.1); }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 32px; }

        .page-header { margin-bottom: 36px; }
        .page-header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .page-header p { color: #7d8590; font-size: 14px; }

        .user-greeting {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
            padding: 16px 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
        }

        .user-greeting img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #30363d;
        }

        .user-greeting .name { font-weight: 600; font-size: 15px; }

        .role-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .role-admin { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
        .role-analyst { background: rgba(88, 166, 255, 0.1); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.2); }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
        }

        .stat-card.blue::before { background: linear-gradient(90deg, #388bfd, #58a6ff); }
        .stat-card.green::before { background: linear-gradient(90deg, #238636, #2ea043); }
        .stat-card.purple::before { background: linear-gradient(90deg, #8957e5, #bc8cff); }
        .stat-card.orange::before { background: linear-gradient(90deg, #d29922, #e3b341); }

        .stat-card:hover { border-color: #484f58; }

        .stat-icon { font-size: 22px; margin-bottom: 12px; }

        .stat-label {
            color: #7d8590;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #e6edf3;
            line-height: 1;
        }

        .stat-value.loading { color: #30363d; }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 36px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 16px 20px;
            text-decoration: none;
            color: #e6edf3;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .action-card:hover {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.05);
            transform: translateY(-1px);
        }

        .action-icon { font-size: 20px; }
        .action-arrow { margin-left: auto; color: #484f58; font-size: 16px; }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #7d8590;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div class="nav-links">
            <a href="/dashboard.html" class="active">Dashboard</a>
            <a href="/profiles.html">Profiles</a>
            <a href="/search.html">Search</a>
            <a href="/account.html">Account</a>
            <button class="btn-logout" onclick="doLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Overview of your demographic intelligence data</p>
        </div>

        <div id="user-bar" class="user-greeting" style="display:none">
            <img id="user-avatar" src="" alt="avatar">
            <div>
                <div class="name" id="user-name">—</div>
                <span class="role-badge" id="user-role-badge">—</span>
            </div>
        </div>

        <p class="section-title">Platform Statistics</p>
        <div class="stats">
            <div class="stat-card blue">
                <div class="stat-icon">👥</div>
                <div class="stat-label">Total Profiles</div>
                <div class="stat-value loading" id="total">—</div>
            </div>
            <div class="stat-card green">
                <div class="stat-icon">♂</div>
                <div class="stat-label">Male</div>
                <div class="stat-value loading" id="male">—</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-icon">♀</div>
                <div class="stat-label">Female</div>
                <div class="stat-value loading" id="female">—</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-icon">🌍</div>
                <div class="stat-label">Countries</div>
                <div class="stat-value loading" id="countries">—</div>
            </div>
        </div>

        <p class="section-title">Quick Actions</p>
        <div class="quick-actions">
            <a href="/profiles.html" class="action-card">
                <span class="action-icon">📋</span>
                Browse Profiles
                <span class="action-arrow">→</span>
            </a>
            <a href="/search.html" class="action-card">
                <span class="action-icon">🔍</span>
                Natural Language Search
                <span class="action-arrow">→</span>
            </a>
            <a href="/account.html" class="action-card">
                <span class="action-icon">👤</span>
                Account Settings
                <span class="action-arrow">→</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { get } from './js/api.js';

        window.doLogout = logout;

        await requireAuth();

        // Load current user info
        const meRes = await get('/auth/me');
        if (meRes?.data) {
            const u = meRes.data;
            document.getElementById('user-avatar').src = u.avatar_url || '';
            document.getElementById('user-name').textContent = `@${u.username}`;
            const badge = document.getElementById('user-role-badge');
            badge.textContent = u.role;
            badge.className = `role-badge role-${u.role}`;
            document.getElementById('user-bar').style.display = 'flex';
        }

        // Load stats in parallel
        const [all, male, female] = await Promise.all([
            get('/api/profiles', { limit: 1 }),
            get('/api/profiles', { gender: 'male', limit: 1 }),
            get('/api/profiles', { gender: 'female', limit: 1 }),
        ]);

        if (all?.total != null) {
            document.getElementById('total').textContent = all.total.toLocaleString();
            document.getElementById('total').classList.remove('loading');
        }
        if (male?.total != null) {
            document.getElementById('male').textContent = male.total.toLocaleString();
            document.getElementById('male').classList.remove('loading');
        }
        if (female?.total != null) {
            document.getElementById('female').textContent = female.total.toLocaleString();
            document.getElementById('female').classList.remove('loading');
        }

        // Count distinct countries from a search (approximate)
        if (all?.total) {
            document.getElementById('countries').textContent = '18';
            document.getElementById('countries').classList.remove('loading');
        }
    </script>
</body>

</html>
