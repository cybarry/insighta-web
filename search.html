<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Insighta Labs+</title>
    <meta name="description" content="Natural language demographic search on Insighta Labs+.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #e6edf3, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        nav a {
            color: #7d8590;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active { color: #58a6ff; background: rgba(88, 166, 255, 0.1); }

        .btn-logout {
            background: transparent;
            border: 1px solid #30363d;
            color: #f85149;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .btn-logout:hover { background: rgba(248, 81, 73, 0.1); }

        .container { max-width: 900px; margin: 0 auto; padding: 48px 32px; }

        .page-header { margin-bottom: 8px; }
        .page-header h1 { font-size: 24px; font-weight: 700; }

        .hint {
            color: #7d8590;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .hint strong { color: #58a6ff; }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        input#q {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        input#q:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        input#q::placeholder { color: #484f58; }

        .btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover { background: #2ea043; transform: translateY(-1px); }

        #status {
            font-size: 13px;
            color: #7d8590;
            margin-bottom: 16px;
            min-height: 20px;
        }

        .table-wrap {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }

        th {
            background: #161b22;
            color: #7d8590;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #30363d;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td { padding: 13px 16px; border-bottom: 1px solid #21262d; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(88, 166, 255, 0.03); }

        td a { color: #58a6ff; text-decoration: none; font-weight: 500; }

        .gender-m { color: #388bfd; }
        .gender-f { color: #d2a8ff; }

        .example-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .chip {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .chip:hover { border-color: #58a6ff; color: #58a6ff; background: rgba(88, 166, 255, 0.08); }

        .error { color: #f85149; font-size: 14px; }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/profiles.html">Profiles</a>
            <a href="/search.html" class="active">Search</a>
            <a href="/account.html">Account</a>
            <button class="btn-logout" onclick="doLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Natural Language Search</h1>
        </div>
        <p class="hint">Search profiles in plain English. Try: <strong>"young males from nigeria"</strong>, <strong>"adult females above 30"</strong>, <strong>"seniors from kenya"</strong></p>

        <div class="example-chips">
            <span class="chip" onclick="setQuery('young males from nigeria')">young males from nigeria</span>
            <span class="chip" onclick="setQuery('adult females above 30')">adult females above 30</span>
            <span class="chip" onclick="setQuery('seniors from kenya')">seniors from kenya</span>
            <span class="chip" onclick="setQuery('teenagers in ghana')">teenagers in ghana</span>
            <span class="chip" onclick="setQuery('males between 25 and 40')">males between 25 and 40</span>
        </div>

        <div class="search-box">
            <input id="q" placeholder="Search profiles in plain English..." onkeydown="if(event.key==='Enter') doSearch()">
            <button class="btn" onclick="doSearch()">Search</button>
        </div>

        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script type="module">
        import { get } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        window.doLogout = logout;

        await requireAuth();

        window.setQuery = function (text) {
            document.getElementById('q').value = text;
            doSearch();
        };

        window.doSearch = async function () {
            const q = document.getElementById('q').value.trim();
            if (!q) return;

            const status = document.getElementById('status');
            const results = document.getElementById('results');
            status.textContent = 'Searching...';
            results.innerHTML = '';

            const res = await get('/api/profiles/search', { q });

            if (!res || res.status === 'error') {
                status.textContent = '';
                results.innerHTML = `<p class="error">${res?.message || 'Search failed. Try rephrasing your query.'}</p>`;
                return;
            }

            if (!res.data?.length) {
                status.textContent = 'No results found.';
                return;
            }

            status.textContent = `${res.total.toLocaleString()} result(s) found`;
            results.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Gender</th><th>Age</th><th>Age Group</th><th>Country</th></tr>
                        </thead>
                        <tbody>
                            ${res.data.map(p => `
                                <tr>
                                    <td><a href="/profile.html?id=${p.id}">${p.name}</a></td>
                                    <td class="gender-${p.gender?.[0]}">${p.gender}</td>
                                    <td>${p.age}</td>
                                    <td>${p.age_group}</td>
                                    <td>${p.country_id}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        };
    </script>
</body>

</html>
