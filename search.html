<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Search | Insighta Labs+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
        }

        nav a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 32px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        input {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #161b22;
            color: #8b949e;
            padding: 12px 16px;
            text-align: left;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
        }

        #hint {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 24px;
        }

        #results {
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/profiles.html">Profiles</a>
            <a href="/account.html">Account</a>
        </div>
    </nav>
    <div class="container">
        <h1>Natural Language Search</h1>
        <p id="hint">Try: "young males from nigeria", "adult females above 30", "seniors from kenya"</p>
        <div class="search-row">
            <input id="q" placeholder="Search profiles in plain English..." onkeydown="if(event.key==='Enter')search()">
            <button class="btn" onclick="search()">Search</button>
        </div>
        <div id="results"></div>
    </div>
    <script type="module">
        import { get } from './js/api.js';
        import { requireAuth } from './js/auth.js';
        await requireAuth();

        window.search = async function () {
            const q = document.getElementById('q').value.trim();
            if (!q) return;
            document.getElementById('results').innerHTML = '<p style="color:#8b949e">Searching...</p>';
            const res = await get('/api/profiles/search', { q });
            if (!res || res.status === 'error') {
                document.getElementById('results').innerHTML =
                    `<p style="color:#f85149">${res?.message || 'Error'}</p>`;
                return;
            }
            if (!res.data?.length) {
                document.getElementById('results').innerHTML = '<p style="color:#8b949e">No results found.</p>';
                return;
            }
            document.getElementById('results').innerHTML = `
        <p style="color:#8b949e;margin-bottom:16px">${res.total} result(s)</p>
        <table>
          <thead><tr><th>Name</th><th>Gender</th><th>Age</th><th>Country</th></tr></thead>
          <tbody>${res.data.map(p =>
                `<tr><td>${p.name}</td><td>${p.gender}</td><td>${p.age}</td><td>${p.country_id}</td></tr>`
            ).join('')}</tbody>
        </table>
      `;
        };
    </script>
</body>

</html>
