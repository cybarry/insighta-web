<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Insighta Labs+</title>
    <meta name="description" content="Insighta Labs+ — Your account profile and settings.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #e6edf3, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        nav a {
            color: #7d8590;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        nav a:hover { color: #e6edf3; background: #21262d; }
        nav a.active { color: #58a6ff; background: rgba(88, 166, 255, 0.1); }

        .btn-logout {
            background: transparent;
            border: 1px solid #30363d;
            color: #f85149;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .btn-logout:hover { background: rgba(248, 81, 73, 0.1); }

        .container {
            max-width: 560px;
            margin: 48px auto;
            padding: 0 24px;
        }

        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 24px; font-weight: 700; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            overflow: hidden;
        }

        .card-header {
            padding: 32px 32px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #21262d;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid #30363d;
            object-fit: cover;
        }

        .avatar-placeholder {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .user-info h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-admin { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
        .role-analyst { background: rgba(88, 166, 255, 0.1); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.2); }

        .card-body { padding: 8px 0; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 32px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .row:last-child { border-bottom: none; }

        .label { color: #7d8590; font-weight: 500; }

        .value { color: #e6edf3; font-weight: 400; }

        .status-active {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #3fb950;
            font-size: 13px;
        }

        .status-active::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #3fb950;
            border-radius: 50%;
        }

        .card-footer {
            padding: 20px 32px;
            border-top: 1px solid #21262d;
            background: rgba(248, 81, 73, 0.03);
        }

        .btn-logout-full {
            background: transparent;
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #f85149;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            width: 100%;
        }

        .btn-logout-full:hover { background: rgba(248, 81, 73, 0.1); }

        .skeleton {
            background: linear-gradient(90deg, #21262d 25%, #2d333b 50%, #21262d 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            height: 16px;
            width: 120px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/profiles.html">Profiles</a>
            <a href="/search.html">Search</a>
            <a href="/account.html" class="active">Account</a>
            <button class="btn-logout" onclick="doLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Account</h1>
        </div>

        <div class="card" id="card">
            <!-- Loading skeleton -->
            <div class="card-header">
                <div class="avatar-placeholder">👤</div>
                <div class="user-info">
                    <div class="skeleton" style="width:140px; height:20px; margin-bottom:10px"></div>
                    <div class="skeleton" style="width:70px; height:16px"></div>
                </div>
            </div>
            <div class="card-body">
                <div class="row"><span class="label">Loading...</span></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { get } from './js/api.js';

        window.doLogout = logout;

        await requireAuth();

        // Single call to /auth/me using cookie-based auth from api.js
        const res = await get('/auth/me');
        const u = res?.data;

        if (!u) {
            document.getElementById('card').innerHTML = '<div class="card-body"><div class="row"><span class="label">Failed to load profile.</span></div></div>';
            return;
        }

        const roleClass = u.role === 'admin' ? 'role-admin' : 'role-analyst';
        const memberSince = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '—';
        const lastLogin = u.last_login_at ? new Date(u.last_login_at).toLocaleString() : '—';

        document.getElementById('card').innerHTML = `
            <div class="card-header">
                ${u.avatar_url
                ? `<img src="${u.avatar_url}" alt="Avatar" class="avatar">`
                : `<div class="avatar-placeholder">👤</div>`}
                <div class="user-info">
                    <h2>@${u.username}</h2>
                    <span class="role-badge ${roleClass}">${u.role}</span>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <span class="label">Status</span>
                    <span class="status-active">Active</span>
                </div>
                <div class="row">
                    <span class="label">Email</span>
                    <span class="value">${u.email || '—'}</span>
                </div>
                <div class="row">
                    <span class="label">GitHub ID</span>
                    <span class="value">${u.github_id}</span>
                </div>
                <div class="row">
                    <span class="label">Member Since</span>
                    <span class="value">${memberSince}</span>
                </div>
                <div class="row">
                    <span class="label">Last Login</span>
                    <span class="value">${lastLogin}</span>
                </div>
            </div>
            <div class="card-footer">
                <button class="btn-logout-full" onclick="doLogout()">Sign Out</button>
            </div>
        `;
    </script>
</body>

</html>
