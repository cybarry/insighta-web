<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Detail | Insighta Labs+</title>
    <meta name="description" content="View detailed demographic profile on Insighta Labs+.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #e6edf3, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        nav a {
            color: #7d8590;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        nav a:hover { color: #e6edf3; background: #21262d; }

        .btn-logout {
            background: transparent;
            border: 1px solid #30363d;
            color: #f85149;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .btn-logout:hover { background: rgba(248, 81, 73, 0.1); }

        .container { max-width: 680px; margin: 0 auto; padding: 40px 24px; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            transition: opacity 0.15s;
        }

        .back-link:hover { opacity: 0.8; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            overflow: hidden;
        }

        .card-header {
            padding: 28px 32px;
            border-bottom: 1px solid #21262d;
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.05), transparent);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            text-transform: capitalize;
            margin-bottom: 8px;
        }

        .profile-sub { color: #7d8590; font-size: 14px; }

        .card-body { padding: 8px 0; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 32px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label { color: #7d8590; font-weight: 500; }

        .detail-value { color: #e6edf3; }

        .detail-value .sub { color: #484f58; font-size: 12px; margin-left: 6px; }

        .prob-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prob-bar {
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            width: 80px;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            background: linear-gradient(90deg, #388bfd, #58a6ff);
            border-radius: 3px;
        }

        .gender-m { color: #388bfd; }
        .gender-f { color: #d2a8ff; }

        .age-group-badge {
            display: inline-block;
            background: #21262d;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #7d8590;
        }

        .not-found {
            text-align: center;
            padding: 60px 32px;
            color: #7d8590;
        }

        .not-found .icon { font-size: 36px; margin-bottom: 12px; }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/profiles.html">Profiles</a>
            <a href="/search.html">Search</a>
            <a href="/account.html">Account</a>
            <button class="btn-logout" onclick="doLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <a href="/profiles.html" class="back-link">← All Profiles</a>
        <div id="card" class="card">
            <div class="card-header">
                <div class="profile-name">Loading...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { get } from './js/api.js';
        import { requireAuth, logout } from './js/auth.js';

        window.doLogout = logout;

        await requireAuth();

        const id = new URLSearchParams(location.search).get('id');
        if (!id) {
            document.getElementById('card').innerHTML = `<div class="not-found"><div class="icon">🔍</div><p>No profile ID provided.</p></div>`;
            return;
        }

        const res = await get(`/api/profiles/${id}`);
        const p = res?.data;

        if (!p) {
            document.getElementById('card').innerHTML = `<div class="not-found"><div class="icon">😕</div><p>Profile not found.</p></div>`;
            return;
        }

        const gClass = p.gender === 'male' ? 'gender-m' : 'gender-f';
        const gProb = Math.round(p.gender_probability * 100);
        const cProb = Math.round(p.country_probability * 100);
        const created = p.created_at ? new Date(p.created_at).toLocaleString() : '—';

        document.getElementById('card').innerHTML = `
            <div class="card-header">
                <div class="profile-name">${p.name}</div>
                <div class="profile-sub">Profile ID: ${p.id}</div>
            </div>
            <div class="card-body">
                <div class="detail-row">
                    <span class="detail-label">Gender</span>
                    <span class="detail-value ${gClass}">
                        ${p.gender}
                        <span class="sub">${gProb}% confidence</span>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Gender Probability</span>
                    <div class="prob-bar-wrap">
                        <div class="prob-bar"><div class="prob-fill" style="width:${gProb}%"></div></div>
                        <span class="detail-value">${p.gender_probability}</span>
                    </div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Age</span>
                    <span class="detail-value">${p.age} years</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Age Group</span>
                    <span class="age-group-badge">${p.age_group}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Country</span>
                    <span class="detail-value">
                        ${p.country_name} <span class="sub">(${p.country_id})</span>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Country Probability</span>
                    <div class="prob-bar-wrap">
                        <div class="prob-bar"><div class="prob-fill" style="width:${cProb}%"></div></div>
                        <span class="detail-value">${p.country_probability}</span>
                    </div>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Created At</span>
                    <span class="detail-value">${created}</span>
                </div>
            </div>
        `;
    </script>
</body>

</html>
