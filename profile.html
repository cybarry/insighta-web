<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile | Insighta Labs+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
        }

        nav a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 32px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 32px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 24px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .label {
            color: #8b949e;
        }

        .back {
            color: #58a6ff;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div><a href="/profiles.html">← Back</a></div>
    </nav>
    <div class="container">
        <a href="/profiles.html" class="back">← All Profiles</a>
        <div class="card" id="card">Loading...</div>
    </div>
    <script type="module">
        import { get } from './js/api.js';
        import { requireAuth } from './js/auth.js';
        await requireAuth();

        const id = new URLSearchParams(location.search).get('id');
        const res = await get(`/api/profiles/${id}`);
        const p = res?.data;
        if (!p) { document.getElementById('card').textContent = 'Profile not found.'; return; }

        document.getElementById('card').innerHTML = `
      <h1>${p.name}</h1>
      ${[
                ['ID', p.id], ['Gender', `${p.gender} (${p.gender_probability})`],
                ['Age', `${p.age} (${p.age_group})`],
                ['Country', `${p.country_name} (${p.country_id}) — ${p.country_probability}`],
                ['Created', new Date(p.created_at).toLocaleString()],
            ].map(([l, v]) => `<div class="row"><span class="label">${l}</span><span>${v}</span></div>`).join('')}
    `;
    </script>
</body>

</html>
