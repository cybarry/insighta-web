<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insighta Labs+ | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #58a6ff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .btn-github {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-github:hover {
            background: #2ea043;
        }

        .btn-github svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">Insighta Labs+</div>
        <div class="subtitle">Demographic Intelligence Platform</div>
        <a href="#" onclick="login()" class="btn-github">
            <svg viewBox="0 0 16 16">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
            Continue with GitHub
        </a>
    </div>
    <script>
        const API = 'https://insighta-backend-production-b142.up.railway.app';
        function login() { window.location.href = `${API}/auth/github`; }

        // Check if already logged in
        fetch(`${API}/auth/refresh`, { method: 'POST', credentials: 'include' })
            .then(r => r.ok ? window.location.href = '/dashboard.html' : null)
            .catch(() => { });
    </script>
</body>

</html>
