<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profiles | Insighta Labs+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
        }

        nav a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            background: #161b22;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #161b22;
            color: #8b949e;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
        }

        tr:hover td {
            background: #161b22;
        }

        td a {
            color: #58a6ff;
            text-decoration: none;
        }

        .pagination {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            align-items: center;
        }

        .pagination button {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #info {
            color: #8b949e;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="brand">Insighta Labs+</div>
        <div>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/search.html">Search</a>
            <a href="/account.html">Account</a>
        </div>
    </nav>
    <div class="container">
        <h1>Profiles</h1>
        <div class="filters">
            <select id="gender">
                <option value="">All Genders</option>
                <option>male</option>
                <option>female</option>
            </select>
            <select id="age_group">
                <option value="">All Age Groups</option>
                <option>child</option>
                <option>teenager</option>
                <option>adult</option>
                <option>senior</option>
            </select>
            <input id="country_id" placeholder="Country ID (e.g. NG)" maxlength="2">
            <button class="btn" onclick="load(1)">Filter</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Age</th>
                    <th>Age Group</th>
                    <th>Country</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div class="pagination">
            <button id="prev" onclick="load(page-1)" disabled>← Prev</button>
            <span id="info"></span>
            <button id="next" onclick="load(page+1)" disabled>Next →</button>
        </div>
    </div>
    <script type="module">
        import { get } from './js/api.js';
        import { requireAuth } from './js/auth.js';
        await requireAuth();
        window.page = 1;

        window.load = async function (p) {
            window.page = p;
            const params = { page: p, limit: 20 };
            const g = document.getElementById('gender').value;
            const ag = document.getElementById('age_group').value;
            const c = document.getElementById('country_id').value;
            if (g) params.gender = g;
            if (ag) params.age_group = ag;
            if (c) params.country_id = c.toUpperCase();

            const res = await get('/api/profiles', params);
            if (!res) return;

            const tbody = document.getElementById('tbody');
            tbody.innerHTML = res.data.map(p =>
                `<tr><td><a href="/profile.html?id=${p.id}">${p.name}</a></td>
         <td>${p.gender}</td><td>${p.age}</td>
         <td>${p.age_group}</td><td>${p.country_id}</td></tr>`
            ).join('');

            document.getElementById('info').textContent =
                `Page ${res.page} of ${res.total_pages} — ${res.total} total`;
            document.getElementById('prev').disabled = res.page <= 1;
            document.getElementById('next').disabled = res.page >= res.total_pages;
        };

        load(1);
    </script>
</body>

</html>
